<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Phase 4 Web GIS Data Smoke Test</title>
<style>
html,body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f6f7f8;color:#1f2933}
main{max-width:1200px;margin:auto;padding:16px}
.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:20px;margin:0 0 4px}
.small{font-size:12px;color:#55616d}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:12px}
#map{width:100%;aspect-ratio:4/3;background:#e8edf0;border:1px solid #ccd3d8;border-radius:10px;overflow:hidden}
#map svg{width:100%;height:100%;display:block}
.panel{background:white;border:1px solid #d8dee3;border-radius:10px;padding:12px}
.metric{display:flex;justify-content:space-between;border-bottom:1px solid #edf0f2;padding:5px 0;font-size:13px}
.ok{color:#176b45;font-weight:600}.bad{color:#a33}
.legend-row{display:flex;gap:7px;align-items:center;font-size:12px;margin:5px 0}
.swatch{width:14px;height:14px;border-radius:3px}
@media(max-width:720px){main{padding:8px}.grid{grid-template-columns:1fr}.panel{order:-1}h1{font-size:17px}}
</style>
</head>
<body>
<main>
<div class="header"><div><h1>Phase 4 Web GIS Data Smoke Test</h1><div class="small">Vanilla-browser loader/render check; no external libraries.</div></div><div id="status">Loading…</div></div>
<div class="grid">
  <div id="map"></div>
  <div class="panel">
    <div id="metrics"></div>
    <hr/>
    <b style="font-size:13px">GWRPZ legend</b>
    <div class="legend-row"><span class="swatch" style="background:#BA493A"></span>Class 1 — Low</div>
    <div class="legend-row"><span class="swatch" style="background:#E2AA3E"></span>Class 2 — Moderate</div>
    <div class="legend-row"><span class="swatch" style="background:#298079"></span>Class 3 — High</div>
  </div>
</div>
</main>
<script>
const t0=performance.now();
const sources={
  villages:"../vectors/villages.geojson",
  aquifers:"../vectors/aquifers.geojson",
  drainage:"../vectors/drainage_order.geojson",
  lineaments:"../vectors/lineaments.geojson",
  interventions:"../structures/interventions.geojson",
  lulc:"../vectors/lulc.geojson"
};
const styles={
  villages:{stroke:"#666",fill:"none",width:.6},
  drainage:{stroke:"#4C8FBD",fill:"none",width:.55},
  lineaments:{stroke:"#7B5AA6",fill:"none",width:1.2},
  interventions:{stroke:"#fff",fill:"#172B4D",width:.7},
  aquifers:{stroke:"#7A746D",fill:"none",width:.5},
  lulc:{stroke:"#A5A5A5",fill:"none",width:.35}
};
function coordsWalk(c,b){
  if(typeof c[0]==="number"){b[0]=Math.min(b[0],c[0]);b[1]=Math.min(b[1],c[1]);b[2]=Math.max(b[2],c[0]);b[3]=Math.max(b[3],c[1]);}
  else for(const x of c) coordsWalk(x,b);
}
function pathLine(coords,proj,close=false){let s="";coords.forEach((p,i)=>{const q=proj(p);s+=(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)});if(close)s+="Z";return s}
function geomPath(g,proj){
  const c=g.coordinates,t=g.type;
  if(t==="LineString") return pathLine(c,proj);
  if(t==="MultiLineString") return c.map(x=>pathLine(x,proj)).join("");
  if(t==="Polygon") return c.map(x=>pathLine(x,proj,true)).join("");
  if(t==="MultiPolygon") return c.flatMap(p=>p.map(x=>pathLine(x,proj,true))).join("");
  return "";
}
(async()=>{
 try{
  const entries=await Promise.all(Object.entries(sources).map(async([k,u])=>[k,await (await fetch(u)).json()]));
  const data=Object.fromEntries(entries);
  const rasters=await (await fetch("raster_sources.json")).json();
  const bbox=[Infinity,Infinity,-Infinity,-Infinity];
  Object.values(data).forEach(fc=>fc.features.forEach(f=>coordsWalk(f.geometry.coordinates,bbox)));
  const W=1000,H=750,pad=8;
  const proj=([x,y])=>[pad+(x-bbox[0])/(bbox[2]-bbox[0])*(W-2*pad),H-pad-(y-bbox[1])/(bbox[3]-bbox[1])*(H-2*pad)];
  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  // raster image source placed by its lon/lat corner envelope
  const rc=rasters.gwrpz_class.image_coordinates_tl_tr_br_bl;
  const rb=[Math.min(...rc.map(x=>x[0])),Math.min(...rc.map(x=>x[1])),Math.max(...rc.map(x=>x[0])),Math.max(...rc.map(x=>x[1]))];
  const tl=proj([rb[0],rb[3]]), br=proj([rb[2],rb[1]]);
  svg+=`<image href="../rasters/gwrpz_class.png" x="${tl[0]}" y="${tl[1]}" width="${br[0]-tl[0]}" height="${br[1]-tl[1]}" opacity=".72" preserveAspectRatio="none"/>`;
  for(const k of ["lulc","aquifers","villages","drainage","lineaments"]){
    const st=styles[k];
    for(const f of data[k].features){
      const d=geomPath(f.geometry,proj); if(!d) continue;
      svg+=`<path d="${d}" fill="${st.fill}" stroke="${st.stroke}" stroke-width="${st.width}" vector-effect="non-scaling-stroke"/>`;
    }
  }
  for(const f of data.interventions.features){
    const p=proj(f.geometry.coordinates);
    svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${styles.interventions.fill}" stroke="#fff" stroke-width=".7"/>`;
  }
  svg+="</svg>";
  document.getElementById("map").innerHTML=svg;
  const elapsed=performance.now()-t0;
  const counts=Object.entries(data).map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v.features.length}</b></div>`).join("");
  document.getElementById("metrics").innerHTML=counts+`<div class="metric"><span>Load + render</span><b>${elapsed.toFixed(1)} ms</b></div><div class="metric"><span>Viewport</span><b>${innerWidth}×${innerHeight}</b></div>`;
  document.getElementById("status").innerHTML='<span class="ok">PASS</span>';
  document.body.dataset.smoke="pass";
 }catch(e){
  document.getElementById("status").innerHTML='<span class="bad">FAIL</span>';
  document.getElementById("metrics").textContent=e.stack||e;
  document.body.dataset.smoke="fail";
 }
})();
</script>
</body></html>
